apiVersion: apps/v1
kind: Deployment # what kubernetes objects i am creating
metadata:
  name: kafka  # this gives deployment an identity

spec:
  replicas: 1
  selector:   # the deployment needs to know which pod belongs to me
    matchLabels:
      app: kafka

  template:
    metadata:
     labels:
      app: kafka #Now selector match the deployment looking for app=kafa matches with pod has app= kafka
                  # connection established.

    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          ports:
            - containerPort: 9092 # kafka container listens for client connections on port 9092

          env:
            - name: KAFKA_NODE_ID #gives kafka server unique id
              value: "1"
            - name: KAFKA_PROCESS_ROLES # this tells kafka it has two roles
              value: "broker,controller"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS #kafka controller with node id 1 is available at kafka:9093
              value: "1@localhost:9093"

            - name: KAFKA_LISTENERS # tells kafka which ports should i listen to one is for kafka clients and other is for kafka controller communication
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"

            - name: KAFKA_ADVERTISED_LISTENERS # tell the client to use kafka:9092 if they ask me how to connect with kafka
              value: "PLAINTEXT://kafka:9092"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES # Use the listner named controller for controller communication
              value: "CONTROLLER"

            - name: KAFKA_OFFSET_TOPIC_REPLICATION_FACTOR # kafka stores consumer progress in an internal topic called offsets, 1 broker so 1
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR #Kafka stores information about transactions in an internal topic
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR #kafka needs at least 1 healthy synchronized copy before it allows trasactions state data to be written
              value: "1"

