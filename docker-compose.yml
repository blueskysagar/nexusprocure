services:
  postgres:
    image: "postgres:17"
    restart: unless-stopped
    container_name: nexusprocure-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: nexusprocure-redis
    restart: unless-stopped

    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nexusprocure:
    build: .
    container_name: nexusprocure-app
    restart: unless-stopped

    ports:
     - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

      kafka:
        condition: service_healthy



    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

  kafka:
    image: apache/kafka:latest
    container_name: nexusprocure-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"
      - "9094:9094"

    environment:
      KAFKA_NODE_ID: 1 # Give this kafka server unique id
      KAFKA_PROCESS_ROLES: broker, controller # Tells Kafka what job should this service perform
      # broker: store messages, recieve messages, send message to consumers, manage partitions
      #controller: controller manage kafka itself, creating topic, deleting topic, cluster metadata etc.
      KAFKA_LISTENERS: PLAINTEXT://:9092, PLAINTEXT_HOST://:9094, CONTROLLER://:9093
      # tells kafka which ports should i open and what traffic comes here
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092, PLAINTEXT_HOST://localhost:9094
      # what address should Kafka tell clients to use
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:  PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # which listener is for controller
      KAFKA_CONTROLLER_QUORUM_VOTERS:  1@kafka:9093
      #controller node with id 1 can participate in controller voting
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


    healthcheck:
      test: ["CMD-SHELL",  "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s





volumes:
 postgres-data:













